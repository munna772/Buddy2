name: Build Buddy Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Download sherpa-onnx Android library
        run: |
          mkdir -p android/app/libs
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" \
            --output android/app/libs/sherpa-onnx-2.0.1.aar
          test -s android/app/libs/sherpa-onnx-2.0.1.aar
          ls -lh android/app/libs/sherpa-onnx-2.0.1.aar

      - name: Prepare native Hey Buddy wake-word engine
        run: |
          python -m pip install --disable-pip-version-check sentencepiece==0.2.3
          MODEL_DIR="sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${MODEL_DIR}.tar.bz2" \
            --output /tmp/buddy-kws-model.tar.bz2
          mkdir -p /tmp/buddy-kws-model
          tar -xjf /tmp/buddy-kws-model.tar.bz2 -C /tmp/buddy-kws-model
          SOURCE="/tmp/buddy-kws-model/${MODEL_DIR}"
          DEST="android/app/src/main/assets/${MODEL_DIR}"
          mkdir -p "${DEST}"
          cp "${SOURCE}/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" "${DEST}/"
          cp "${SOURCE}/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" "${DEST}/"
          cp "${SOURCE}/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx" "${DEST}/"
          cp "${SOURCE}/tokens.txt" "${DEST}/"
          python scripts/make-wake-keywords.py "${SOURCE}/bpe.model" "${DEST}/keywords.txt"
          test -s "${DEST}/keywords.txt"
          ls -lh "${DEST}"

      - name: Add wake-word native Android components
        run: python scripts/prepare-android-wakeword.py

      - name: Sync Buddy app and native plugins
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Buddy APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Buddy-AI-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
