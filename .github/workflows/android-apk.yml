name: Build Buddy Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare native Hey Buddy wake-word engine
        run: |
          python -m pip install --disable-pip-version-check sherpa-onnx==1.12.36 click
          MODEL_DIR="sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${MODEL_DIR}.tar.bz2" \
            --output /tmp/buddy-kws-model.tar.bz2
          mkdir -p /tmp/buddy-kws-model
          tar -xjf /tmp/buddy-kws-model.tar.bz2 -C /tmp/buddy-kws-model
          SOURCE="/tmp/buddy-kws-model/${MODEL_DIR}"
          DEST="android/app/src/main/assets/${MODEL_DIR}"
          mkdir -p "${DEST}"
          cp "${SOURCE}/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" "${DEST}/"
          cp "${SOURCE}/decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx" "${DEST}/"
          cp "${SOURCE}/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx" "${DEST}/"
          cp "${SOURCE}/tokens.txt" "${DEST}/"
          cp "${SOURCE}/bpe.model" "${DEST}/"
          printf 'HEY BUDDY @HEY_BUDDY\n' > /tmp/buddy-keywords-raw.txt
          sherpa-onnx-cli text2token \
            --tokens "${DEST}/tokens.txt" \
            --tokens-type bpe \
            --bpe-model "${DEST}/bpe.model" \
            /tmp/buddy-keywords-raw.txt "${DEST}/keywords.txt"
          test -s "${DEST}/keywords.txt"
          ls -lh "${DEST}"

      - name: Add wake-word native Android components
        run: python scripts/prepare-android-wakeword.py

      - name: Sync Buddy app and native plugins
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Buddy APK
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-AI-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
