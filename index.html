<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Buddy AI — your private personal AI assistant.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/buddy-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/buddy-icon.svg">
  <title>Buddy AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">B</div>
      <div class="brand-copy"><h1>Buddy</h1><p>Your AI companion</p></div>
      <span class="status"><i></i> Online</span>
    </header>

    <nav class="quick-actions" aria-label="Chat tools">
      <button id="view-memories" class="tool-button" type="button" aria-controls="memories-panel" aria-expanded="false">
        <span class="tool-icon" aria-hidden="true">✦</span><span>Memories</span>
      </button>
      <button id="load-history" class="tool-button" type="button">
        <span class="tool-icon" aria-hidden="true">◷</span><span>Chat history</span>
      </button>
    </nav>
    <p id="history-status" class="inline-status" role="status" aria-live="polite"></p>

    <section id="memories-panel" class="memories-panel" hidden aria-live="polite">
      <div class="section-heading">
        <div><h2>Saved memories</h2><p id="memories-status">Your personal notes, kept by Buddy.</p></div>
        <span class="section-mark" aria-hidden="true">✦</span>
      </div>
      <div id="memories-list" class="memories-list"></div>
    </section>

    <section id="chat" class="chat" aria-live="polite">
      <div class="welcome">
        <div class="welcome-mark" aria-hidden="true">B</div>
        <h2>Hey, I'm Buddy.</h2>
        <p>I'm here whenever you need to think, learn, or talk.</p>
      </div>
      <div class="bubble buddy">What would you like to talk about?</div>
    </section>

ils>

    <form id="chat-form">
      <div class="composer">
        <input id="message" autocomplete="off" placeholder="Message Buddy..." aria-label="Message Buddy" required>
        <button id="send" type="submit" aria-label="Send message"><span>Send</span><b aria-hidden="true">↗</b></button>
      </div>
    </form>
    <p class="note">Gemini-powered text assistant</p>
  </main>
  <script src="/app.bundle.js"></script>
</body>
</html>
